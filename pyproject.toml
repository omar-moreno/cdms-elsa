[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdms-elsa"
version = "0.1.0"
description = "ELog Search Assistant — LLM-powered semantic search for CDMS ELOG"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Omar Moreno" }]
keywords = ["elog", "semantic-search", "embeddings", "rag", "cdms"]

dependencies = [
    # Core parsing has no runtime deps (stdlib only).
    # Search/indexing deps added in later phases:
    # "sentence-transformers>=2.2",
    # "chromadb>=0.4",
    # "fastapi>=0.104",
    # "uvicorn>=0.24",
    # "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]

[project.scripts]
elsa-inspect = "elsa.parsing.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["elsa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["elsa", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
